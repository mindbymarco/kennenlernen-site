<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  width:1200px;height:630px;
  background:#F5F3F0;
  font-family:'Karla',system-ui,sans-serif;
  position:relative;
}
/* pixel dither background - pure CSS dots approximation */
.bg{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 520px 380px at 78% 18%, rgba(168,184,150,0.38) 0%, transparent 70%),
    radial-gradient(ellipse 520px 360px at 62% 55%, rgba(188,168,214,0.34) 0%, transparent 68%),
    radial-gradient(ellipse 480px 340px at 88% 82%, rgba(123,167,209,0.42) 0%, transparent 68%);
}
.dots{
  position:absolute;inset:0;
  background-image: radial-gradient(rgba(0,0,0,0.055) 1px, transparent 1px);
  background-size:12px 12px;
  opacity:0.9;
}
.content{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  justify-content:center;
  padding:56px 64px 48px 64px;
}
.eyebrow{
  font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
  color:#7BA7D1;font-weight:500;margin-bottom:22px;
}
h1{
  font-family:'Montserrat',system-ui,sans-serif;
  font-weight:600;line-height:1.06;letter-spacing:-0.02em;
  color:#0A0A09;font-size:56px;max-width:780px;
}
h1 em{font-style:italic;color:#7BA7D1;font-weight:600}
.sub{
  margin-top:22px;font-size:16px;line-height:1.6;color:#4A4A48;max-width:560px;
}
.brand{
  position:absolute;bottom:28px;left:64px;right:64px;
  display:flex;justify-content:space-between;align-items:center;
  border-top:1px solid #D8DDD6;padding-top:16px;
}
.brand-left{font-family:'Montserrat',system-ui,sans-serif;font-weight:600;font-size:15px;color:#0A0A09}
.brand-right{font-size:12px;color:#8A8A86;letter-spacing:0.04em}
.url{font-size:12px;color:#7BA7D1;letter-spacing:0.06em}
</style>
</head>
<body>
<div class="bg"></div>
<div class="dots"></div>
<div class="content">
  <div class="eyebrow">Marco Grotemeyer · AI Builder</div>
  <h1>KI-Erfolg entsteht nicht beim Tool, sondern bei der <em>Befähigung</em> der Menschen.</h1>
  <div class="sub">Partner für unternehmensweite KI-Transformation. Befähigung und technische Umsetzung aus einer Hand.</div>
</div>
<div class="brand">
  <span class="brand-left">Marco Grotemeyer</span>
  <span class="url">marcogrotemeyer.de</span>
  <span class="brand-right">AI Consulting · Remote DACH</span>
</div>
</body>
</html>
