  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Person","@id":"https://marcogrotemeyer.de/#person","name":"Marco Grotemeyer","jobTitle":"AI Builder","url":"https://marcogrotemeyer.de/","image":"https://marcogrotemeyer.de/profile.jpg","worksFor":{"@id":"https://marcogrotemeyer.de/#organization"},"sameAs":["https://www.linkedin.com/in/marco-grotemeyer","https://beyond925.de","https://foundersfoundation.de"]},{ "@type":"Organization","@id":"https://marcogrotemeyer.de/#organization","name":"Marco Grotemeyer — AI Consulting","url":"https://marcogrotemeyer.de/","logo":"https://marcogrotemeyer.de/og-image.jpg","founder":{"@id":"https://marcogrotemeyer.de/#person"}},{ "@type":"WebSite","@id":"https://marcogrotemeyer.de/#website","url":"https://marcogrotemeyer.de/","name":"Marco Grotemeyer — KI-Transformation für den Mittelstand","inLanguage":"de-DE","publisher":{"@id":"https://marcogrotemeyer.de/#organization"},"author":{"@id":"https://marcogrotemeyer.de/#person"}},{ "@type":"WebPage","@id":"https://marcogrotemeyer.de/#webpage","url":"https://marcogrotemeyer.de/","name":"Marco Grotemeyer — KI-Transformation für den Mittelstand","isPartOf":{"@id":"https://marcogrotemeyer.de/#website"},"about":{"@id":"https://marcogrotemeyer.de/#person"},"inLanguage":"de-DE"}]}</script>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","@id":"https://marcogrotemeyer.de/#faq","inLanguage":"de-DE","mainEntity":[{"@type":"Question","name":"Wir haben schon ChatGPT — warum reicht das nicht?","acceptedAnswer":{"@type":"Answer","text":"Einzelne Mitarbeiter mit ChatGPT sind ein guter Anfang — aber keine organisierte Adoption. Es fehlen Plattform, Governance, Datenanbindung und vor allem: die Priorisierung, welche Use Cases wirklich etwas bringen. Ich helfe Ihnen, vom Tool-Einsatz zur strategischen Nutzung zu kommen."}},{"@type":"Question","name":"Wir sind 30 Mitarbeiter — lohnt sich das überhaupt?","acceptedAnswer":{"@type":"Answer","text":"Gerade dann. Ein Enablement-Sprint amortisiert sich schnell, wenn Sie danach einen Use Case produktiv haben, der vorher 5–10 Stunden pro Woche verschlungen hat. Ich rechne Ihnen das im Erstgespräch konkret durch."}},{"@type":"Question","name":"Was kostet das?","acceptedAnswer":{"@type":"Answer","text":"Enablement-Sprint: pauschal. Pilot: nach Aufwand mit klarer Obergrenze. Rollout-Begleitung: monatlicher Retainer. Konkrete Preise besprechen wir im Erstgespräch — abhängig von Umfang und Use Case. Keine versteckten Kosten, keine Tool-Resale-Provisionen."}},{"@type":"Question","name":"Wie messen wir Erfolg?","acceptedAnswer":{"@type":"Answer","text":"Konkret: Zeitersparnis pro Vorgang, Anzahl bearbeiteter Vorgänge pro Woche, Nutzungsquote im Team. Wir definieren vor dem Pilot zwei bis drei Zahlen, die für Sie wirklich zählen — und messen nach 4 Wochen nüchtern."}},{"@type":"Question","name":"Was ist mit Datenschutz / Betriebsrat?","acceptedAnswer":{"@type":"Answer","text":"Das ist kein Bonus, das ist Grundlage. Ich arbeite bevorzugt mit Plattformen, die DSGVO-konform in der EU hosten. Vor dem Pilot klären wir mit Ihrem Datenschutzbeauftragten und — wo vorhanden — mit dem Betriebsrat die Spielregeln. Nichts geht live ohne Freigabe."}},{"@type":"Question","name":"Bauen Sie auch selbst, oder nur Beratung?","acceptedAnswer":{"@type":"Answer","text":"Ich baue selbst. Piloten setze ich gemeinsam mit Ihrem Team in Ihrer Plattform um. Für größere Eigenentwicklungen empfehle ich spezialisierte Engineering-Partner und begleite die Übergabe."}},{"@type":"Question","name":"Wie lange dauert es, bis wir erste Wirkung sehen?","acceptedAnswer":{"@type":"Answer","text":"Pilot: erste produktive Nutzung in 2–4 Wochen. Erste messbare Wirkung typischerweise nach 4–6 Wochen. Enablement-Sprint: priorisierte Use-Case-Liste nach 2 Wochen."}},{"@type":"Question","name":"Wo stößt ChatGPT im Unternehmen an Grenzen?","acceptedAnswer":{"@type":"Answer","text":"Bei Datenschutz, Datenanbindung und Skalierung. ChatGPT ist eine Einzellösung ohne Zugriff auf Ihre Systeme, ohne Rechteverwaltung und ohne Governance. Eine KI-Plattform in der EU löst das: angebunden an ERP/CRM, mit Rollen, Protokoll und Betriebsrat-Freigabe — und alle Mitarbeitenden arbeiten im selben, sicheren Rahmen."}},{"@type":"Question","name":"Welche KI-Use-Cases bringen im Mittelstand am schnellsten ROI?","acceptedAnswer":{"@type":"Answer","text":"Angebotserstellung, E-Mail-Triage, Recherche & Reporting, Onboarding-Wissen und CRM-Pflege. Das sind tägliche, messbare Tätigkeiten mit 5–10 Stunden Hebel pro Woche. Im Enablement-Sprint priorisieren wir genau diese — nach Aufwand, Wirkung und Datenverfügbarkeit, nicht nach Hype."}},{"@type":"Question","name":"Wie läuft der Use-Case-Discovery-Workshop ab?","acceptedAnswer":{"@type":"Answer","text":"Zwei Wochen, vier Säulen: Prozesse, Daten, Organisation, Governance. Wir interviewen Fachbereiche, sammeln 15–25 Ideen, bewerten sie nach Wirkung vs. Aufwand und liefern 5–10 priorisierte Use Cases mit Pilot-Empfehlung — als Entscheidungsvorlage für die Geschäftsführung, nicht als Folien-Stapel."}},{"@type":"Question","name":"Was kostet eine KI-Beratung für den Mittelstand konkret?","acceptedAnswer":{"@type":"Answer","text":"Beispiel 30–50 Mitarbeitende: Enablement-Sprint pauschal (4-stellig), Pilot 2–4 Wochen nach Aufwand mit fester Obergrenze, Rollout als monatlicher Retainer. Ein Use Case mit 5 Stunden Ersparnis pro Woche amortisiert den Sprint meist in 6–10 Wochen — ich rechne es im Erstgespräch mit Ihren Zahlen durch."}},{"@type":"Question","name":"Wie starten wir am besten?","acceptedAnswer":{"@type":"Answer","text":"Mit dem Erstgespräch — 30 Minuten, kostenlos, unverbindlich. Wir schauen, ob und wo ich helfen kann. Wenn nicht, sage ich Ihnen das ehrlich."}}]}</script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"DefinedTermSet","@id":"https://marcogrotemeyer.de/#glossar","name":"KI-Glossar Mittelstand","inLanguage":"de-DE","hasDefinedTerm":[{"@type":"DefinedTerm","@id":"https://marcogrotemeyer.de/#term-ai-workspace","name":"AI Workspace","description":"Ein zentraler, DSGVO-konformer Arbeitsraum statt verteilter Tools: E-Mail, Kalender, Notizen, Recherche und eigene Agents teilen denselben Kontext und dasselbe Memory — anpassbar auf Ihre Prozesse.","inDefinedTermSet":{"@id":"https://marcogrotemeyer.de/#glossar"}},{"@type":"DefinedTerm","@id":"https://marcogrotemeyer.de/#term-agentic-engineering","name":"Agentic Engineering","description":"Eigene KI-Agenten und Workflows, die Ihre Systeme verbinden: von n8n/Make-Automationen bis zu RAG auf internen Daten — gebaut für Ihre wiederkehrenden Vorgänge, nicht generisch.","inDefinedTermSet":{"@id":"https://marcogrotemeyer.de/#glossar"}},{"@type":"DefinedTerm","@id":"https://marcogrotemeyer.de/#term-4-saeulen","name":"4-Säulen-Framework","description":"Methode im Discovery: Prozesse, Daten, Organisation und Governance. Daraus entstehen 15–25 Ideen, bewertet nach Wirkung vs. Aufwand — Ergebnis: 5–10 priorisierte Use Cases mit Pilot-Empfehlung.","inDefinedTermSet":{"@id":"https://marcogrotemeyer.de/#glossar"}}]}]}</script>
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Service","@id":"https://marcogrotemeyer.de/#service-befaehigung","name":"Befähigung (Academy)","serviceType":"KI-Befähigung und Academy","provider":{"@id":"https://marcogrotemeyer.de/#organization"},"areaServed":{"@type":"Country","name":"Deutschland"},"description":"Workshops, Sprechstunden, Botschafter-Modell. Sie verstehen, was Sie nutzen — und warum es funktioniert."},{"@type":"Service","@id":"https://marcogrotemeyer.de/#service-adoption","name":"Adoption (Rollout)","serviceType":"KI-Plattform Rollout und Governance","provider":{"@id":"https://marcogrotemeyer.de/#organization"},"areaServed":{"@type":"Country","name":"Deutschland"},"description":"KI-Plattform-Auswahl und -Einführung, Governance-Framework für den Mittelstand, Betriebsrat- und DSGVO-Begleitung."},{"@type":"Service","@id":"https://marcogrotemeyer.de/#service-engineering","name":"Agentic Engineering (Build)","serviceType":"KI-Agenten und Workflow-Automatisierung","provider":{"@id":"https://marcogrotemeyer.de/#organization"},"areaServed":{"@type":"Country","name":"Deutschland"},"description":"Maßgeschneiderte AI-Agenten, n8n/Make-Workflows, RAG-Systeme und Voice-AI für Ihre Use Cases."},{"@type":"HowTo","@id":"https://marcogrotemeyer.de/#ablauf","name":"Wie wir starten — 4 Schritte zur produktiven KI-Nutzung","inLanguage":"de-DE","step":[{"@type":"HowToStep","position":1,"name":"Erstgespräch","text":"30 Minuten, kostenlos. Wir schauen auf Ihre Ausgangslage und die sinnvollsten nächsten Schritte."},{"@type":"HowToStep","position":2,"name":"Enablement-Sprint","text":"2 Wochen. Workshops mit Fachbereichen, Use-Case-Liste, Priorisierung nach Aufwand und Wirkung."},{"@type":"HowToStep","position":3,"name":"Pilot","text":"2–4 Wochen. Ein Use Case produktiv in Ihrer KI-Plattform — mit Schulung, Datenanbindung und sauberer Übergabe."},{"@type":"HowToStep","position":4,"name":"Rollout","text":"Optional. Governance, Adoption, weitere Use Cases. Vom ersten Pilot bis zum unternehmensweiten Rollout."}]}]}</script>
